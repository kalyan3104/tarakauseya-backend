[package]
name = "tara-kauseya-api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal", "io-util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "limit", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand_core = "0.6"

# Render's free builders have a strict build-time limit. This API is I/O bound,
# so the small runtime benefit of the default, fully optimized Rust release
# profile is not worth making every clean deployment compile significantly
# longer. These settings keep the binary production-ready while prioritising
# reliable deployment builds.
[profile.release]
opt-level = 1
codegen-units = 256
debug = 0
strip = "symbols"
